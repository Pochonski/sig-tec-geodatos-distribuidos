name: sig-tec-ops

services:
  central:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: sig_tec
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${OPS_CENTRAL_PASSWORD:?Define OPS_CENTRAL_PASSWORD en ops/.env}
    ports:
      - "127.0.0.1:57430:5432"
    volumes:
      - central_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_prepared_transactions=10"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sig_tec"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  cartago:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: sig_tec
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${OPS_CARTAGO_PASSWORD:?Define OPS_CARTAGO_PASSWORD en ops/.env}
    ports:
      - "127.0.0.1:57431:5432"
    volumes:
      - cartago_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_prepared_transactions=10"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sig_tec"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  central_data:
  cartago_data:
